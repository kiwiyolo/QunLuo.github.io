name: Render and Publish Quarto website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quarto-pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify language, community, and blog interactions
        run: node --test scripts/test_language_switch.cjs scripts/test_community.cjs scripts/test_interactions.cjs

      - name: Render
        run: quarto render

      - name: Verify published content
        run: python3 scripts/verify_site.py _site

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
