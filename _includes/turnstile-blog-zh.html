<section class="ql-interactions" aria-label="文章互动">
  <div class="ql-actions-bar">
    <button id="ql-like-btn" class="ql-action-btn" type="button" aria-pressed="false" aria-label="为本文点赞">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l7.78 7.78 7.78-7.78a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>点赞</span> <span id="ql-like-count">—</span>
    </button>
    <button id="ql-share-btn" class="ql-action-btn" type="button">复制链接</button>
  </div>
  <p id="ql-action-status" class="ql-status-msg" role="status" aria-live="polite"></p>
  <div class="ql-comments-section">
    <h3>评论</h3>
    <div id="ql-comments-list" class="ql-comments-list" aria-live="polite"><p>正在加载评论…</p></div>
    <button id="ql-comments-retry" class="ql-action-btn" type="button" hidden>重新加载</button>
    <form id="ql-comment-form" class="ql-comment-form">
      <h4>发表评论</h4>
      <label for="ql-comment-name">昵称（选填）</label>
      <input type="text" id="ql-comment-name" autocomplete="nickname" maxlength="50">
      <label for="ql-comment-content">评论内容</label>
      <textarea id="ql-comment-content" maxlength="2000" rows="4" required placeholder="分享您的想法…"></textarea>
      <div class="ql-turnstile-box">
        <p class="ql-turnstile-desc">完成人机验证后即可点赞或评论。评论经审核后显示。</p>
        <div class="cf-turnstile" data-language="zh-cn" data-sitekey="0x4AAAAAACzZJprJ4npD9l7W" data-callback="qlOnTurnstileSuccess" data-expired-callback="qlOnTurnstileExpired" data-error-callback="qlOnTurnstileError" data-size="flexible"></div>
      </div>
      <button id="ql-comment-submit" class="ql-btn-primary" type="submit">提交评论</button>
      <p id="ql-comment-status" class="ql-status-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
