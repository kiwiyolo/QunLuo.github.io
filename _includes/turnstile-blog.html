<section class="ql-interactions" aria-label="Post interactions">
  <div class="ql-actions-bar">
    <button id="ql-like-btn" class="ql-action-btn" type="button" aria-pressed="false" aria-label="Like this post">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l7.78 7.78 7.78-7.78a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span>Like</span> <span id="ql-like-count">—</span>
    </button>
    <button id="ql-share-btn" class="ql-action-btn" type="button">Copy link</button>
  </div>
  <p id="ql-action-status" class="ql-status-msg" role="status" aria-live="polite"></p>
  <div class="ql-comments-section">
    <h3>Comments</h3>
    <div id="ql-comments-list" class="ql-comments-list" aria-live="polite"><p>Loading comments…</p></div>
    <button id="ql-comments-retry" class="ql-action-btn" type="button" hidden>Retry</button>
    <form id="ql-comment-form" class="ql-comment-form">
      <h4>Leave a reply</h4>
      <label for="ql-comment-name">Name (optional)</label>
      <input type="text" id="ql-comment-name" autocomplete="nickname" maxlength="50">
      <label for="ql-comment-content">Comment</label>
      <textarea id="ql-comment-content" maxlength="2000" rows="4" required placeholder="What are your thoughts?"></textarea>
      <div class="ql-turnstile-box">
        <p class="ql-turnstile-desc">Complete verification to like or comment. Comments appear after moderation.</p>
        <div class="cf-turnstile" data-language="en" data-sitekey="0x4AAAAAACzZJprJ4npD9l7W" data-callback="qlOnTurnstileSuccess" data-expired-callback="qlOnTurnstileExpired" data-error-callback="qlOnTurnstileError" data-size="flexible"></div>
      </div>
      <button id="ql-comment-submit" class="ql-btn-primary" type="submit">Post comment</button>
      <p id="ql-comment-status" class="ql-status-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
