<script>
  const SUPABASE_FUNCTIONS_URL = "https://fracycwtkurcimbwcvjz.supabase.co/functions/v1";
  window.__ql_turnstile_token = null;
  function qlOnTurnstileSuccess(token) { window.__ql_turnstile_token = token; document.dispatchEvent(new Event('ql-captcha-ready')); }
  function qlOnTurnstileExpired() { window.__ql_turnstile_token = null; }
  function qlOnTurnstileError() { qlOnTurnstileExpired(); document.dispatchEvent(new Event('ql-captcha-error')); }
  function qlResetCaptcha() {
    qlOnTurnstileExpired();
    if (window.turnstile) { try { window.turnstile.reset(); } catch {} }
  }
  function getDeviceId() {
    if (window.__ql_device_id) return window.__ql_device_id;
    let id;
    try { id = localStorage.getItem('ql_device_id'); } catch {}
    if (!id) {
      id = 'device_' + (window.crypto?.randomUUID?.() || Math.random().toString(36).slice(2) + Date.now().toString(36));
      try { localStorage.setItem('ql_device_id', id); } catch {}
    }
    return window.__ql_device_id = id;
  }
  function getPostSlug() {
    return window.location.pathname.replace(/^\/QunLuo\.github\.io\//, '').replace(/^\//, '').replace(/^zh\//, '').replace(/\.html$/, '');
  }
</script>
