project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - content/*.qmd
    - blog/index.qmd
    - blog/Automatic-Research-20260401.qmd
    - subscribe.qmd
    - 404.qmd
  resources:
    - CNAME
    - robots.txt
    - .nojekyll

execute:
  enabled: false

lang: en
author: "LUO Qun"

website:
  title: "LUO Qun · 罗群"
  description: "The personal website of LUO Qun (罗群). Earth system science, hydrology, and physically interpretable AI."
  site-url: https://qunluo-kiwi.com/
  favicon: img/kiwi.png
  search: true
  open-graph: true
  navbar:
    left:
      - text: "About"
        href: content/about.qmd
      - text: "Research"
        href: content/project.qmd
      - text: "Publications"
        href: content/publications.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Contact"
        href: content/contact.qmd
    right:
      - text: "Subscribe"
        href: subscribe.qmd
      - icon: github
        aria-label: "LUO Qun on GitHub"
        href: https://github.com/kiwiyolo/
      - text: "Private Plan ↗"
        href: https://planner.qunluo-kiwi.com/
  page-footer:
    left: "© 2026 LUO Qun · 罗群"
    right:
      - text: "Privacy"
        href: content/privacy.qmd
      - text: "Built with Quarto"
        href: https://quarto.org/

format:
  html:
    theme: custom.scss
    toc: true
    toc-depth: 2
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

editor: source
